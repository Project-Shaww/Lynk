<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEST APP</title>
</head>
<body>
    <h1>TEST APP</h1>
</body>
<script type="text/javascript">
    (async () => {
    const Lynk = await import('../lynk-sdk/index.js');
    const host = new Lynk.Host();
    await host.connect();
    console.log(host);
    window.host = host;
    const server = await host.createServer('http');
    server.on('request', (req) => {
        console.log(req);
        req.res(200, {'Content-Type': 'application/json'}, JSON.stringify({ message: 'Hello World' }))
    })
    console.log('http://localhost:'+server.getPort());
    window.server = server;
    })();
</script>
</html>
