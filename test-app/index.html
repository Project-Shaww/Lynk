<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEST APP</title>

<body>
    <h1>TEST APP</h1>
</body>
<script type="text/javascript">
    (async () => {
    const Lynk = await import('../lynk-sdk/index.js');
    const host = new Lynk.Host();
    host.connect();
    console.log(host);
    window.host = host;
    host.on('welcome',async() => {
    const server = await host.createServer('ws');
    server.on('clientMessage', console.log, 'a');
    server.on('clientJoined', console.log, 'a');
    server.on('clientLeft', console.log, 'a');
    host.on('serverMessage', console.log, 'a');
    console.log('ws://127.0.0.1:'+server.getPort());
    window.server = server;
    }, 'a')
    })();
</script>
</html>
