<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }

    .hidden {
        display: none !important;
    }

    .chat-container {
        display: flex;
        flex-direction: column;
        height: 97vh;
    }

    .messages-container {
        flex-grow: 1;
        overflow-y: auto;
    }

    .message-container {
        display: flex;
        align-items: flex-start;
        margin: 10px;
    }

    .message-bubble {
        background-color: #e8f0fe;
        padding: 10px 16px;
        border-radius: 50px;
        max-width: 60%;
        word-wrap: break-word;
        box-shadow: 0 0 50px rgba(0, 0, 0, 0.05);
    }

    .sender-message-container {
        justify-content: flex-end;
    }

    .sender-message-bubble {
        background-color: #007bff;
        color: white;
    }

    .message-input-container {
        display: flex;
        align-items: center;
        padding: 10px;
        background-color: white;
    }

    #messageInput {
        flex-grow: 1;
        margin-right: 6px;
        border: none;
        outline: none;
        border-radius: 50px;
        height: 30px;
        font-size: 16px;
        background-color: #e8f0fe;
        padding: 10px 16px 10px 16px;
    }

    #sendButton {
        background-color: #007bff;
        border-radius: 50px;
        outline: none;
        border: none;
        padding: 14px 16px 14px 16px;
        color: #fff;
        font-size: 16px;
        cursor: pointer;
    }

    #sendButton:hover{
        box-shadow: 0 0 50px rgba(0, 0, 0, 0.05);
    }

    #sendButton:active {
        background-color: #3b9aff;
    }

    #login {
        margin-left: 20vw;
        margin-right: 20vw;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
    }

    h1 {
        font-weight: 900;
        font-size: 40px;
        text-align: center;
    }

    .login-host-form {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0px;
    }

    .login-host-form p {
        font-size: 26px;
        font-weight: 700;
    }

    .login-host-form button {
        background-color: #007bff;
        border-radius: 50px;
        outline: none;
        border: none;
        padding: 14px 16px 14px 16px;
        color: #fff;
        font-size: 16px;
        cursor: pointer;
    }

    .login-host-form button:hover{
        box-shadow: 0 0 50px rgba(0, 0, 0, 0.05);
    }

    .login-host-form button:active {
        background-color: #3b9aff;
    }

    .login-client-form {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0px;
    }

    .login-client-form p {
        font-size: 26px;
        font-weight: 700;
    }

    .login-client-form div {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 0px;
        border-radius: 50px;
        border: none;
        outline: none;
        overflow: hidden;
    }

    .login-client-form input {
        padding: 10px 16px;
        outline: none;
        border: none;
        padding: 14px 16px 14px 16px;
        color: #000;
        background-color: #e8f0fe;
        font-size: 16px;
        cursor: pointer;
    }

    .login-client-form button {
        background-color: #007bff;
        outline: none;
        border: none;
        padding: 14px 16px 14px 16px;
        color: #fff;
        font-size: 16px;
        cursor: pointer;
    }

    .login-client-form button:hover{
        box-shadow: 0 0 50px rgba(0, 0, 0, 0.05);
    }

    .login-client-form button:active {
        background-color: #3b9aff;
    }

    .ortext {
        color: #999;
        font-size: 20px;
        text-align: center;
    }

    .chat-header {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
    }

    .chat-header p {
        font-size: 18px;
        font-weight: 700;
    }
    
    .chat-header input {
        font-size: 18px;
        font-weight: 700;
        border: none;
        outline: none;
        background-color: #e8f0fe;
        color: #000;
        text-align: center;
        width: 40%;
        padding: 10px 16px;
        border-radius: 50px;
    }

    #chatStatus {
        font-size: 16px;
        font-weight: 700;
        text-align: center;
        color: #444;
    }

    #chatURL:hover,
    #chatURL:active {
        cursor: pointer;
        text-decoration: underline;
    }
  </style>
  <title>Lynk Chat</title>
</head>
<body>
    <div class="login-container" id="login">
        <div class="login-form">
            <h1>Lynk Chat</h1>
            <div class="login-host-form">
              <p>Host a chat</p>
              <button id="hostSubmitButton">Host Chat</button>
            </div>
            <p class="ortext">-or-</p>
            <div class="login-client-form">
              <p>Join a chat</p>
              <div>
                <input type="text" id="clientInput" placeholder="Enter server ip">
                <button id="clientSubmitButton">Join Chat</button>
              </div>
            </div>
        </div>
    </div>
  <div class="chat-container hidden" id="chat-container">
    <div class="chat-header">
        <h1>Lynk Chat</h1>
        <p id="chatURL"></p>
        <p id="chatStatus"></p>
        <input type="text" id="usernameInput" placeholder="Enter username">
    </div>
    <div class="messages-container" id="messages"></div>
    <div class="message-input-container">
      <input type="text" id="messageInput" placeholder="Type a message...">
      <button id="sendButton">Send</button>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
        const hostButton = document.getElementById('hostSubmitButton');
        const clientButton = document.getElementById('clientSubmitButton');
        const clientInput = document.getElementById('clientInput');
        const messagesDiv = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const chatContainer = document.getElementById('chat-container');
        const chatURL = document.getElementById('chatURL');
        const chatStatus = document.getElementById('chatStatus');
        const usernameInput = document.getElementById('usernameInput');

        let host = false;

        function displayMessage(message, isSender = false) {
            const messageContainer = document.createElement('div');
            const messageElement = document.createElement('div');
            messageElement.textContent = message;
            
            messageContainer.classList.add('message-container');
      
            if (isSender) {
                messageContainer.classList.add('sender-message-container');
                messageElement.classList.add('message-bubble', 'sender-message-bubble');
            } else {
                messageElement.classList.add('message-bubble');
            }
      
            messageContainer.appendChild(messageElement);
            messagesDiv.appendChild(messageContainer);
      
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        async function initHostChat() {
            chatStatus.innerText = 'Initializing server...';
            const Lynk = await import('../lynk-sdk/index.js');
            const host = new Lynk.Host();
            host.connect();
            while(!host.isConnected() && !host.getConnectionId()) {
                await new Promise(resolve => setTimeout(resolve, 100));
            }
            const server = await host.createServer('ws');
            chatStatus.innerText = 'Server created';
            chatURL.innerText = 'ws://127.0.0.1:' + server.getPort();
            chatURL.title = 'Click to copy';
            chatURL.addEventListener('click', () => {
                navigator.clipboard.writeText('ws://127.0.0.1:' + server.getPort());
                chatURL.innerText = 'Copied!';
                setTimeout(() => chatURL.innerText = 'ws://127.0.0.1:' + server.getPort(), 2000);
            });

            server.on('clientMessage', (data) => {
                displayMessage(data.payload);
                server.broadcast(data.payload);
            }, 'chat-message-listener');

            server.on('clientJoined', (data) => {
                displayMessage('A member joined the chat');
                server.broadcast('A member joined the chat');
            }, 'chat-client-joined-listener');

            server.on('clientLeft', (data) => {
                displayMessage('A member left the chat');
                server.broadcast('A member left the chat');
            }, 'chat-client-left-listener');

            sendButton.addEventListener('click', () => {
                const message = usernameInput.value + ': ' + messageInput.value;
                server.broadcast(message);
                displayMessage(message, true);
                messageInput.value = '';
            });

            messageInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendButton.click();
            });

            document.addEventListener('beforeunload', (e) => {
                server.close();
            });
        }

        async function initClientChat() {
            const url = new URL(clientInput.value);
            url.protocol = 'ws';
            const ws = new WebSocket(url);
            chatURL.innerText = url;
            chatURL.title = 'Click to copy';
            chatURL.addEventListener('click', () => {
                navigator.clipboard.writeText(url);
                chatURL.innerText = 'Copied!';
                setTimeout(() => chatURL.innerText = url, 2000);
            });
            chatStatus.innerText = 'Connecting to server...';

            ws.addEventListener('open', () => {
                chatStatus.innerText = 'Connected to server';
            });
            ws.addEventListener('close', () => {
                chatStatus.innerText = 'Disconnected from server';
            });
            ws.addEventListener('error', () => {
                chatStatus.innerText = 'Error connecting to server';
            });

            let lastSentMessage = 'A member joined the chat';
            ws.addEventListener('message', (event) => {
                console.log(event, event.data);
                const message = event.data;
                if (message == lastSentMessage) {
                    lastSentMessage = null;
                    return;
                }
                displayMessage(message);
            });
            sendButton.addEventListener('click', () => {
                const message = usernameInput.value + ': ' + messageInput.value;
                ws.send(message);
                lastSentMessage = message;
                displayMessage(message, true);
                messageInput.value = '';
            });

            messageInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendButton.click();
            });

            document.addEventListener('beforeunload', (e) => {
                ws.close();
            });
        }

        hostButton.addEventListener('click', () => {
            host = true;
            chatContainer.classList.remove('hidden');
            document.getElementById('login').classList.add('hidden');
            initHostChat();
        });

        clientButton.addEventListener('click', () => {
            chatContainer.classList.remove('hidden');
            document.getElementById('login').classList.add('hidden');
            initClientChat();
        });

    });
  </script>
</body>
</html>
